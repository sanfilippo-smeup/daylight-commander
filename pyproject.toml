[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daylight-commander"
version = "0.1.0"
description = "Daylight Commander — a fast TUI file commander built with Textual."
requires-python = ">=3.13"
dependencies = [
    "textual>=1.0",
]

[project.scripts]
daylight = "daylight.__main__:cli"

[dependency-groups]
dev = [
    "black",
    "pytest",
    "pytest-textual-snapshot",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/daylight"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
