[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daylight-commander"
version = "1.0.0"
description = "Daylight Commander — a fast TUI file commander built with Textual."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mauro Sanfilippo" }]
keywords = ["tui", "file-manager", "commander", "textual", "terminal"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
requires-python = ">=3.13"
dependencies = [
    "textual>=1.0",
]

[project.urls]
Homepage = "https://github.com/sanfilippo-smeup/daylight-commander"
Repository = "https://github.com/sanfilippo-smeup/daylight-commander"

[project.scripts]
daylight = "daylight.__main__:cli"

[dependency-groups]
dev = [
    "black",
    "pytest",
    "pytest-textual-snapshot",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/daylight"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
